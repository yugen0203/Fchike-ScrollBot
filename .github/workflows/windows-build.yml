name: Build Windows EXE

# main への push、または手動実行でビルド
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download bundled Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\build\browser
        run: python -m playwright install chromium

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --distpath dist --workpath build\_pyi_work build\ScrollBot.spec

      - name: Bundle Chromium next to exe
        shell: cmd
        run: xcopy /E /I /Y build\browser dist\ScrollBot\browser

      - name: Show output tree (debug)
        shell: cmd
        run: dir dist\ScrollBot

      - name: Zip distribution
        run: Compress-Archive -Path dist\ScrollBot\* -DestinationPath ScrollBot-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollBot-Windows
          path: ScrollBot-Windows.zip
          retention-days: 30
